name: Slack → Spotify

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Kaç saat geriye bakılsın? Eski linkleri toplamak için büyük ver (8760 = 1 yıl)"
        default: "48"

permissions:
  contents: write

concurrency:
  group: slack-spotify-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Linkleri playliste ekle
        run: python sync.py
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_PLAYLIST_ID: ${{ secrets.SPOTIFY_PLAYLIST_ID }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || '48' }}
          ADD_ALBUMS: "true"
          INCLUDE_THREADS: "true"
          YOUTUBE_LOOKUP: "true"

      - name: Uyanık tut
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ($(date +%s) - last) / 86400 ))
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
